_comment: 'Per-domain Phase 2 ingestion scope, translated from DATA.md (source of
  truth). `elements` are human-readable FAOSTAT element names, resolved to codes at
  run time via live discovery (src/elt/extract.py) -- never hard-coded here. `item_scope`
  is one of: `crops_only` (QCL only, see config/qcl_crop_items.yaml), `item_set:<name>`
  (bounded list below), or `all` (domain is already small; see PHASE2.md / phase-2-data-engineering
  skill for why each choice was made). `item_filter: client` marks a domain whose
  server-side `item=` filter is confirmed broken (it silently returns zero rows for
  an item code longer than that domain''s internal key width, and prefix-matches
  shorter ones into unrequested child items) -- for those the scope is applied
  client-side instead; see PHASE2.md section 15.'
analysis_period:
  start_year: 2014
  end_year: 2024
min_years_for_history: 7
domains:
  QCL:
    priority: core
    silver_table: silver_production
    bilateral: false
    item_scope: crops_only
    elements:
    - Production|t
    - Area harvested
    - Yield|kg/ha
    extra_dimensions: []
  TM:
    priority: core
    silver_table: silver_trade
    bilateral: true
    item_scope: item_set:food_commodities
    elements:
    - Export quantity|t
    - Export value
    - Import quantity|t
    - Import value
    extra_dimensions: []
  FBS:
    priority: core
    silver_table: silver_food_balance
    bilateral: false
    item_scope: all
    elements:
    - Production
    - Import quantity
    - Export quantity
    - Stock Variation
    - Domestic supply quantity
    - Feed
    - Seed
    - Losses
    - Processing
    - Food
    - Food supply quantity (kg/capita/yr)
    - Food supply (kcal/capita/day)
    - Protein supply quantity (g/capita/day)
    - Fat supply quantity (g/capita/day)
    extra_dimensions: []
  FS:
    priority: core
    silver_table: silver_food_security
    bilateral: false
    item_scope: item_set:fs_indicators
    item_filter: client
    elements: null
    extra_dimensions: []
  CAHD:
    priority: core
    silver_table: silver_affordability
    bilateral: false
    item_scope: item_set:cahd_items
    item_filter: client
    elements: null
    extra_dimensions:
    - release
  RFM:
    priority: supporting
    silver_table: silver_fertilizer_trade
    bilateral: true
    item_scope: item_set:rfm_items
    elements:
    - Export quantity
    - Export value
    - Import quantity
    - Import value
    extra_dimensions: []
  CP:
    priority: supporting
    silver_table: silver_prices
    bilateral: false
    item_scope: item_set:cp_items
    item_filter: client
    elements: null
    extra_dimensions:
    - month
  GT:
    priority: supporting
    silver_table: silver_emissions
    bilateral: false
    item_scope: item_set:gt_items
    elements: all
    extra_dimensions:
    - source
  RL:
    priority: supporting
    silver_table: silver_land_use
    bilateral: false
    item_scope: item_set:rl_items
    elements: all
    extra_dimensions: []
